[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multicare-infectious-dataset"
version = "0.1.0"
description = "Evidence-backed, leakage-controlled MultiCaRe dataset curation"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=18,<22", "Pillow>=10,<13", "PyYAML>=6,<7",
  "jsonschema>=4.19,<5", "pyahocorasick>=2.1,<3",
  "python-dotenv>=1,<2", "ImageHash>=4.3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
medgemma = ["torch>=2.6,<3", "transformers>=4.57,<5", "accelerate>=1.2,<2", "sentencepiece>=0.2,<1"]

[project.scripts]
multicare-data = "multicare_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
